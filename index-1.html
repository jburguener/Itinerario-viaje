<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Itinerario de viaje</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12151a">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg: #12151a;
    --panel: #1b1f27;
    --panel-alt: #232833;
    --panel-alt-2: #2a3040;
    --border: #313746;
    --border-soft: #262c38;
    --amber: #f5a623;
    --amber-dim: #8a6420;
    --teal: #4fd1c5;
    --teal-dim: #2b6e69;
    --violet: #b8a1f5;
    --violet-dim: #5e5085;
    --sleep: #7ec8e3;
    --sleep-dim: #3d6c80;
    --text: #edeef0;
    --muted: #8a93a3;
    --muted-2: #5f6878;
    --danger: #e0645a;
    --radius: 10px;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  #app{ max-width: 640px; margin: 0 auto; padding: 0 0 60px; min-height: 100vh; }

  /* ---------- header ---------- */
  header.top{
    padding: 22px 16px 14px;
    border-bottom: 1px solid var(--border-soft);
    background: linear-gradient(180deg, #161a21 0%, var(--bg) 100%);
    position: sticky; top:0; z-index: 20;
  }
  .eyebrow{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted-2);
    text-transform: uppercase;
    margin: 0 0 4px;
  }
  .trip-row{ display:flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  h1.trip-name{
    font-size: 22px; margin: 0; font-weight: 700; letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .trip-meta{ font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 4px; }
  .gear-btn{
    background: var(--panel-alt); border: 1px solid var(--border); color: var(--text);
    width: 36px; height: 36px; border-radius: 8px; font-size: 16px; cursor:pointer;
    flex-shrink: 0; display:flex; align-items:center; justify-content:center;
  }
  .gear-btn:active{ background: var(--panel-alt-2); }

  .storage-banner{
    margin-top: 12px; background: #2b1f10; border: 1px solid #5a4218; color: #f0c987;
    font-size: 12px; padding: 9px 11px; border-radius: 8px; line-height: 1.5;
  }
  .storage-banner.good{ background: #172a20; border-color: #2c5a3f; color: #8fd6ac; }
  .banner-link{
    background: none; border: none; color: var(--amber); text-decoration: underline;
    font-size: 12px; font-weight: 700; padding: 0; margin-left: 2px; cursor: pointer; font-family: var(--sans);
  }
  .howto-steps{ counter-reset: step; list-style: none; padding: 0; margin: 0; }
  .howto-steps li{
    counter-increment: step; position: relative; padding: 0 0 16px 34px; font-size: 13px; color: var(--text); line-height: 1.5;
  }
  .howto-steps li::before{
    content: counter(step); position:absolute; left:0; top:-1px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--amber); color: #1a1305; font-family: var(--mono); font-size: 12px; font-weight: 700;
    display:flex; align-items:center; justify-content:center;
  }
  .howto-steps b{ color: var(--amber); }

  /* ---------- tabs ---------- */
  .tabs{ display:flex; gap: 4px; padding: 12px 16px 0; }
  .tab-btn{
    flex: 1; background: none; border: none; color: var(--muted);
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.5px; text-transform: uppercase;
    padding: 10px 4px; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .tab-btn.active{ color: var(--amber); border-bottom-color: var(--amber); }

  main{ padding: 14px 16px 0; }

  /* ---------- day strip (boarding-pass stubs) ---------- */
  .day-strip{
    display:flex; gap: 10px; overflow-x: auto; padding: 6px 2px 14px;
    -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity;
  }
  .day-strip::-webkit-scrollbar{ height: 4px; }
  .day-strip::-webkit-scrollbar-thumb{ background: var(--border); border-radius: 4px; }
  .day-stub{
    position: relative; flex: 0 0 auto; width: 74px; scroll-snap-align: start;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 6px 12px; text-align:center; cursor: pointer;
  }
  .day-stub::before, .day-stub::after{
    content:""; position:absolute; width: 12px; height: 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 50%; top: 50%; margin-top: -6px;
  }
  .day-stub::before{ left: -7px; }
  .day-stub::after{ right: -7px; }
  .day-stub.selected{ border-color: var(--amber); background: #241d0f; }
  .day-stub.selected::before, .day-stub.selected::after{ border-color: var(--amber); }
  .day-stub .dow{ font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .day-stub .dnum{ font-family: var(--mono); font-size: 20px; font-weight: 700; margin: 2px 0; }
  .day-stub .mon{ font-family: var(--mono); font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .day-stub .city-tag{ font-size: 9px; color: var(--muted-2); margin-top: 4px; white-space:nowrap; overflow:hidden; text-overflow: ellipsis; }
  .today-stamp{
    position: absolute; top: -10px; right: -10px; background: var(--amber); color: #1a1305;
    font-family: var(--mono); font-size: 8px; font-weight: 700; letter-spacing: 1px;
    padding: 2px 5px; border-radius: 4px; transform: rotate(-8deg);
    box-shadow: 0 2px 6px rgba(0,0,0,.4);
  }

  /* ---------- day header ---------- */
  .day-heading{ display:flex; align-items:baseline; justify-content: space-between; margin: 4px 0 14px; flex-wrap: wrap; gap: 6px;}
  .day-heading h2{ font-size: 17px; margin: 0; font-weight: 700; }
  .day-heading .progress{ font-family: var(--mono); font-size: 11px; color: var(--muted); }

  /* ---------- section ---------- */
  .section-label{
    font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; color: var(--muted);
    text-transform: uppercase; margin: 22px 0 10px; display:flex; align-items:center; gap: 8px;
  }
  .section-label .line{ flex:1; height:1px; background: var(--border-soft); }

  .empty-hint{
    color: var(--muted-2); font-size: 13px; padding: 14px; border: 1px dashed var(--border);
    border-radius: var(--radius); text-align:center;
  }

  /* ---------- fixed event row ---------- */
  .event-row{
    display:flex; gap: 12px; background: var(--panel); border: 1px solid var(--border-soft);
    border-left: 3px solid var(--amber); border-radius: 8px; padding: 11px 12px; margin-bottom: 8px;
  }
  .event-time{ font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--amber); width: 46px; flex-shrink:0; padding-top: 1px; }
  .event-time.notime{ color: var(--muted-2); font-size: 11px; }
  .event-body{ flex:1; min-width: 0; }
  .event-title{ font-size: 14px; font-weight: 600; }
  .event-sub{ font-size: 12px; color: var(--muted); margin-top: 2px; }
  .event-notes{ font-size: 12px; color: var(--muted-2); margin-top: 4px; white-space: pre-wrap; }
  .event-cat{ display:inline-block; font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .5px; color: var(--amber-dim); border: 1px solid var(--amber-dim); border-radius: 4px; padding: 1px 5px; margin-top: 5px; }

  /* ---------- idea row ---------- */
  .idea-row{
    display:flex; gap: 12px; background: var(--panel); border: 1px solid var(--border-soft);
    border-left: 3px dashed var(--teal); border-radius: 8px; padding: 11px 12px; margin-bottom: 8px;
    align-items: flex-start;
  }
  .idea-body{ flex:1; min-width:0; }
  .idea-title{ font-size: 14px; font-weight: 600; }
  .idea-zone{ font-family: var(--mono); font-size: 10px; color: var(--teal); text-transform: uppercase; letter-spacing: .5px; }
  .idea-notes{ font-size: 12px; color: var(--muted-2); margin-top: 4px; white-space: pre-wrap; }
  .idea-cat{ display:inline-block; font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .5px; color: var(--teal-dim); border: 1px solid var(--teal-dim); border-radius: 4px; padding: 1px 5px; margin-top: 5px; }

  /* ---------- transfer row ---------- */
  .transfer-row{
    display:flex; gap: 12px; background: var(--panel); border: 1px solid var(--border-soft);
    border-left: 3px solid var(--violet); border-radius: 8px; padding: 11px 12px; margin-bottom: 8px;
  }
  .transfer-icon{ font-size: 18px; width: 30px; flex-shrink:0; text-align:center; padding-top: 2px; }
  .transfer-body{ flex:1; min-width:0; }
  .transfer-route{ font-size: 14px; font-weight: 600; }
  .transfer-route .arrow{ color: var(--violet); margin: 0 4px; }
  .transfer-times{ font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 2px; }
  .transfer-notes{ font-size: 12px; color: var(--muted-2); margin-top: 4px; white-space: pre-wrap; }
  .transfer-mode{ display:inline-block; font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .5px; color: var(--violet); border: 1px solid var(--violet-dim); border-radius: 4px; padding: 1px 5px; margin-top: 5px; }
  .btn.violet{ border-color: var(--violet-dim); color: var(--violet); }

  /* ---------- stay row ---------- */
  .stay-row{
    display:flex; gap: 12px; background: var(--panel); border: 1px solid var(--border-soft);
    border-left: 3px solid var(--sleep); border-radius: 8px; padding: 11px 12px; margin-bottom: 8px;
  }
  .stay-icon{ font-size: 18px; width: 30px; flex-shrink:0; text-align:center; padding-top: 2px; }
  .stay-body{ flex:1; min-width:0; }
  .stay-title{ font-size: 14px; font-weight: 600; }
  .stay-dates{ font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stay-notes{ font-size: 12px; color: var(--muted-2); margin-top: 4px; white-space: pre-wrap; }
  .stay-mode{ display:inline-block; font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: .5px; color: var(--sleep); border: 1px solid var(--sleep-dim); border-radius: 4px; padding: 1px 5px; margin-top: 5px; }
  .btn.sleep{ border-color: var(--sleep-dim); color: var(--sleep); }

  /* ---------- map ---------- */
  .map-pin{
    background: var(--violet); color:#1a1305; width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:12px;
    border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.4);
  }

  .row-actions{ display:flex; gap: 6px; flex-shrink:0; align-items:flex-start; flex-wrap: wrap; justify-content: flex-end; }
  .icon-btn{
    background: var(--panel-alt); border: 1px solid var(--border); color: var(--muted);
    font-size: 12px; padding: 5px 8px; border-radius: 6px; cursor:pointer; font-family: var(--sans);
    white-space: nowrap;
  }
  .icon-btn:active{ background: var(--panel-alt-2); }
  .icon-btn.danger{ color: var(--danger); border-color: #4a2a28; }
  .icon-btn.confirm{ color: var(--bg); background: var(--danger); border-color: var(--danger); font-weight:600; }
  .assign-select{
    background: var(--panel-alt); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; font-size: 11px; padding: 5px 4px; font-family: var(--sans); max-width: 120px;
  }

  /* ---------- zone group ---------- */
  .zone-group{ margin-bottom: 6px; }
  .zone-title{ font-size: 11px; color: var(--muted); font-family: var(--mono); text-transform: uppercase; letter-spacing: 1px; margin: 14px 0 8px; }

  /* ---------- buttons ---------- */
  .btn-row{ display:flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .btn{
    flex: 1; min-width: 140px; background: var(--panel-alt); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; font-weight: 600; padding: 11px 10px; border-radius: 8px;
    cursor:pointer; font-family: var(--sans); text-align:center;
  }
  .btn:active{ background: var(--panel-alt-2); }
  .btn.primary{ background: var(--amber); color: #1a1305; border-color: var(--amber); }
  .btn.ghost{ background: transparent; }
  .btn.teal{ border-color: var(--teal-dim); color: var(--teal); }
  .btn.full{ width: 100%; flex: none; }
  .btn.small{ padding: 8px 10px; font-size: 12px; flex: none; min-width: 0; }

  /* ---------- modal ---------- */
  .modal-backdrop{
    position: fixed; inset:0; background: rgba(8,10,14,.72); z-index: 100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  @media (min-width: 560px){ .modal-backdrop{ align-items:center; } }
  .modal{
    background: var(--panel); border: 1px solid var(--border); border-top: 3px solid var(--amber);
    width: 100%; max-width: 480px; max-height: 88vh; overflow-y:auto;
    border-radius: 14px 14px 0 0; padding: 20px 18px 24px;
  }
  @media (min-width: 560px){ .modal{ border-radius: 14px; } }
  .modal h3{ margin: 0 0 16px; font-size: 16px; }
  .field{ margin-bottom: 13px; }
  .field label{ display:block; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea{
    width:100%; background: var(--panel-alt); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 10px; font-size: 14px; font-family: var(--sans);
  }
  .field textarea{ min-height: 60px; resize: vertical; }
  .field-row{ display:flex; gap: 10px; }
  .field-row .field{ flex:1; }
  .modal-actions{ display:flex; gap: 8px; margin-top: 18px; }
  .form-error{ color: var(--danger); font-size: 12px; margin-top: -6px; margin-bottom: 10px; }

  /* ---------- onboarding ---------- */
  .onboard{ padding: 30px 4px; }
  .onboard h1{ font-size: 24px; margin: 0 0 6px; }
  .onboard p.lead{ color: var(--muted); font-size: 13px; margin: 0 0 26px; line-height: 1.5; }
  .city-leg{
    background: var(--panel); border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 14px; margin-bottom: 10px; position: relative;
  }
  .city-leg .leg-remove{ position:absolute; top: 10px; right: 10px; }

  .settings-city{
    background: var(--panel-alt); border: 1px solid var(--border-soft); border-radius: 10px;
    padding: 12px; margin-bottom: 8px;
  }

  .toast{
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel-alt-2); border: 1px solid var(--border); color: var(--text);
    padding: 9px 16px; border-radius: 20px; font-size: 12px; z-index: 200; font-family: var(--mono);
  }

  .collapsible-toggle{
    background: none; border: none; color: var(--teal); font-family: var(--mono); font-size: 11px;
    text-transform: uppercase; letter-spacing: 1px; padding: 8px 0; cursor: pointer; display:flex; align-items:center; gap: 6px;
  }
</style>
</head>
<body>
<div id="app">Cargando…</div>

<script>
(function(){

  /* ==================== date utils ==================== */
  var DOW = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  var MON = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

  function parseISO(iso){ // 'YYYY-MM-DD' -> local Date
    var p = iso.split('-');
    return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
  }
  function toISO(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function todayISO(){ return toISO(new Date()); }
  function addDays(iso, n){ var d = parseISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
  function rangeDates(startIso, endIso){
    var out = []; var cur = startIso; var guard = 0;
    while(cur <= endIso && guard < 400){ out.push(cur); cur = addDays(cur,1); guard++; }
    return out;
  }
  function dowLabel(iso){ return DOW[parseISO(iso).getDay()]; }
  function dayNum(iso){ return parseISO(iso).getDate(); }
  function monLabel(iso){ return MON[parseISO(iso).getMonth()]; }
  function fullLabel(iso){ return dowLabel(iso) + ' ' + dayNum(iso) + ' ' + monLabel(iso); }
  function shortRange(startIso, endIso){
    return dayNum(startIso)+' '+MON[parseISO(startIso).getMonth()]+' – '+dayNum(endIso)+' '+MON[parseISO(endIso).getMonth()];
  }

  function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  function esc(s){
    if(s === undefined || s === null) return '';
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var CATS_FIXED = ['Tour / actividad','Alojamiento','Comida','Entrada / ticket','Otro'];
  var CATS_IDEA = ['Para ver','Comida','Compras','Naturaleza','Nocturno','Otro'];
  var MODES = ['Vuelo','Tren','Bus','Auto / traslado privado','Barco','Otro'];
  var MODE_ICON = {'Vuelo':'✈️','Tren':'🚆','Bus':'🚌','Auto / traslado privado':'🚗','Barco':'⛴️','Otro':'➡️'};
  var STAY_TYPES = ['Hotel','Tren nocturno','Otro'];
  var STAY_ICON = {'Hotel':'🏨','Tren nocturno':'🚋','Otro':'🛏️'};

  /* ==================== state ==================== */
  var state = null; // {tripName, cities:[{id,name,startDate,endDate}], fixedEvents:[...], ideas:[...]}
  var LS_KEY = 'itinerario_trip_data_v1';

  var ui = {
    activeTab: 'agenda', // agenda | traslados | ideas
    selectedDate: null,   // 'YYYY-MM-DD'
    modal: null,          // {type, payload}
    pendingDelete: null,  // id string currently showing confirm
    expandedNearby: false,
    showOnboardRestore: false
  };

  function testLocalStorage(){
    try{
      var k = '__itin_test__';
      window.localStorage.setItem(k, '1');
      var ok = window.localStorage.getItem(k) === '1';
      window.localStorage.removeItem(k);
      return ok;
    }catch(e){ return false; }
  }
  var LOCAL_OK = (typeof window.localStorage !== 'undefined') && testLocalStorage();
  var SYNC_ID_KEY = 'itinerario_sync_id_v1';
  var SYNC_BASE = 'https://kvdb.io';
  var SYNC_KEY_NAME = 'itinerary';
  var POLL_MS = 17000;

  var syncId = null;
  var syncStatus = 'nosync'; // 'nosync' | 'ok' | 'offline' | 'syncing'
  var lastSyncedAt = null;
  var syncInFlight = false;
  var pushTimer = null;
  var pollTimer = null;

  function getSyncId(){
    if(!LOCAL_OK) return null;
    try{ return window.localStorage.getItem(SYNC_ID_KEY) || null; }catch(e){ return null; }
  }
  function setSyncIdLocal(id){
    if(!LOCAL_OK) return;
    try{ if(id) window.localStorage.setItem(SYNC_ID_KEY, id); else window.localStorage.removeItem(SYNC_ID_KEY); }catch(e){}
  }
  function cacheLocally(){
    if(!LOCAL_OK) return;
    try{ window.localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
  }
  function loadLocalCache(){
    if(!LOCAL_OK) return null;
    try{ var raw = window.localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  }

  // Nota técnica: usamos KVdb.io porque está pensado explícitamente para
  // llamarse desde JavaScript de navegador (a diferencia de otras opciones
  // que probamos). Evitamos poner Content-Type: application/json a propósito
  // — así el pedido queda como "simple request" y no dispara un preflight
  // CORS que muchos servicios gratuitos no manejan bien.
  async function remoteGet(id){
    var res = await fetch(SYNC_BASE + '/' + id + '/' + SYNC_KEY_NAME);
    if(res.status === 404) throw new Error('código no encontrado (404)');
    if(!res.ok) throw new Error('HTTP '+res.status);
    var text = await res.text();
    if(!text) throw new Error('sin datos guardados todavía');
    return JSON.parse(text);
  }
  async function remoteCreate(data){
    var bres = await fetch(SYNC_BASE + '/', { method:'POST', body: 'email=itinerario-app@example.com' });
    if(!bres.ok) throw new Error('HTTP '+bres.status+' creando el código');
    var id = (await bres.text()).trim();
    if(!id) throw new Error('el servicio no devolvió un código');
    await remotePut(id, data);
    return id;
  }
  async function remotePut(id, data){
    var res = await fetch(SYNC_BASE + '/' + id + '/' + SYNC_KEY_NAME, {
      method: 'POST', body: JSON.stringify(data)
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
  }

  async function loadState(){
    syncId = getSyncId();
    var cached = loadLocalCache();
    state = cached; // mostrar algo de inmediato, sin pantalla en blanco mientras llega la red
    if(syncId){
      syncStatus = 'syncing';
      try{
        var remote = await remoteGet(syncId);
        state = remote;
        cacheLocally();
        syncStatus = 'ok'; lastSyncedAt = Date.now();
      }catch(e){
        console.warn('No se pudo traer la sincronización al iniciar, uso copia local:', e);
        syncStatus = 'offline';
      }
    }
  }

  function schedulePush(){
    if(!syncId) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(function(){
      state._syncMeta = {updatedAt: Date.now()};
      cacheLocally();
      remotePut(syncId, state).then(function(){
        syncStatus = 'ok'; lastSyncedAt = Date.now();
      }).catch(function(e){
        console.warn('No se pudo sincronizar (offline?):', e);
        syncStatus = 'offline';
      }).finally(function(){ updateSyncBadge(); });
    }, 700);
  }

  async function pollRemote(){
    if(!syncId || syncInFlight || (document.visibilityState && document.visibilityState !== 'visible')) return;
    syncInFlight = true;
    try{
      var remote = await remoteGet(syncId);
      var remoteTs = (remote._syncMeta && remote._syncMeta.updatedAt) || 0;
      var localTs = (state._syncMeta && state._syncMeta.updatedAt) || 0;
      if(remoteTs > localTs){
        state = remote;
        cacheLocally();
        render();
      }
      syncStatus = 'ok'; lastSyncedAt = Date.now();
    }catch(e){
      syncStatus = 'offline';
    }
    syncInFlight = false;
    updateSyncBadge();
  }
  function startPolling(){
    stopPolling();
    pollTimer = setInterval(pollRemote, POLL_MS);
    document.addEventListener('visibilitychange', onVisibilityChange);
  }
  function stopPolling(){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
    document.removeEventListener('visibilitychange', onVisibilityChange);
  }
  function onVisibilityChange(){
    if(document.visibilityState === 'visible' && syncId) pollRemote();
  }
  function updateSyncBadge(){
    var el = document.getElementById('sync-badge');
    if(el) el.outerHTML = renderSyncBadge();
  }
  function secondsAgoLabel(){
    if(!lastSyncedAt) return '';
    var s = Math.max(0, Math.round((Date.now()-lastSyncedAt)/1000));
    return s < 60 ? ('hace '+s+'s') : ('hace '+Math.round(s/60)+'min');
  }
  function renderSyncBadge(){
    if(!syncId) return '<span id="sync-badge"></span>';
    var label, cls;
    if(syncStatus === 'ok'){ label = '🔗 Sincronizado '+secondsAgoLabel(); cls='good'; }
    else if(syncStatus === 'syncing'){ label = '🔗 Sincronizando…'; cls=''; }
    else { label = '📴 Sin conexión (guardado local)'; cls=''; }
    return '<div id="sync-badge" class="storage-banner'+(cls?' '+cls:'')+'">'+label+'</div>';
  }

  function persist(successMsg){
    cacheLocally();
    if(syncId){
      schedulePush();
      showToast(successMsg);
    } else {
      showToast(successMsg);
    }
  }

  var toastTimer = null;
  function showToast(msg){
    var el = document.getElementById('toast');
    if(el) el.remove();
    var t = document.createElement('div');
    t.id = 'toast'; t.className='toast'; t.textContent = msg;
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.remove(); }, 4500);
  }

  /* ==================== derived data ==================== */
  function cityForDate(date){
    return (state.cities||[]).find(function(c){
      return c.startDate && c.endDate && date >= c.startDate && date <= c.endDate;
    }) || null;
  }
  function allDays(){
    // unique sorted dates from city ranges + transfer dates, each entry {date, cityId, cityName}
    var set = {};
    (state.cities||[]).forEach(function(c){
      if(!c.startDate || !c.endDate || c.endDate < c.startDate) return;
      rangeDates(c.startDate, c.endDate).forEach(function(d){ set[d] = true; });
    });
    (state.transfers||[]).forEach(function(t){ if(t.date) set[t.date] = true; });
    var dates = Object.keys(set).sort();
    return dates.map(function(d){
      var c = cityForDate(d);
      return {date: d, cityId: c ? c.id : null, cityName: c ? c.name : null};
    });
  }
  function cityById(id){ return (state.cities||[]).find(function(c){ return c.id===id; }); }
  function transfersForDate(date){
    return (state.transfers||[]).filter(function(t){ return t.date===date; })
      .sort(function(a,b){ var ta=a.departTime||'99:99', tb=b.departTime||'99:99'; return ta.localeCompare(tb); });
  }
  function allTransfersSorted(){
    return (state.transfers||[]).slice().sort(function(a,b){
      if(a.date !== b.date) return (a.date||'').localeCompare(b.date||'');
      return (a.departTime||'99:99').localeCompare(b.departTime||'99:99');
    });
  }
  function staysForDate(date){
    return (state.stays||[]).filter(function(s){ return s.checkIn && s.checkOut && date >= s.checkIn && date < s.checkOut; });
  }
  function allStaysSorted(){
    return (state.stays||[]).slice().sort(function(a,b){ return (a.checkIn||'').localeCompare(b.checkIn||''); });
  }
  function fixedForDay(cityId, date){
    return (state.fixedEvents||[]).filter(function(e){ return e.cityId===cityId && e.date===date; })
      .sort(function(a,b){
        var ta = a.time || '99:99', tb = b.time || '99:99';
        return ta.localeCompare(tb);
      });
  }
  function ideasAssignedForDay(cityId, date){
    return (state.ideas||[]).filter(function(i){ return i.cityId===cityId && i.assignedDate===date; });
  }
  function ideasPoolForCity(cityId){
    return (state.ideas||[]).filter(function(i){ return i.cityId===cityId && !i.assignedDate; });
  }
  function groupByZone(ideas){
    var groups = {};
    ideas.forEach(function(i){
      var z = i.zone && i.zone.trim() ? i.zone.trim() : 'Sin zona';
      if(!groups[z]) groups[z] = [];
      groups[z].push(i);
    });
    return groups;
  }

  function ensureSelectedDay(){
    var days = allDays();
    if(days.length === 0){ ui.selectedDate = null; return; }
    var stillValid = ui.selectedDate && days.some(function(d){ return d.date===ui.selectedDate; });
    if(stillValid) return;
    var t = todayISO();
    var todayMatch = days.find(function(d){ return d.date === t; });
    ui.selectedDate = todayMatch ? todayMatch.date : days[0].date;
  }

  /* ==================== render ==================== */
  function render(){
    var root = document.getElementById('app');
    if(!state){ root.innerHTML = renderOnboarding(); return; }
    ensureSelectedDay();
    var html = renderHeader();
    html += renderTabs();
    var body = ui.activeTab==='agenda' ? renderAgenda() : (ui.activeTab==='traslados' ? renderTransfersTab() : (ui.activeTab==='noches' ? renderStaysTab() : renderIdeasBank()));
    html += '<main>' + body + '</main>';
    if(ui.modal){ html += renderModal(); }
    root.innerHTML = html;
    if(ui.activeTab === 'agenda' && ui.selectedDate){ mountDayMap(ui.selectedDate); }
  }

  function renderHeader(){
    var days = allDays();
    var meta = '';
    if(days.length){
      meta = shortRange(days[0].date, days[days.length-1].date) + ' · ' + days.length + ' día' + (days.length===1?'':'s');
    }
    var banner = syncId ? renderSyncBadge() :
      '<div class="storage-banner">💡 ¿Viajás acompañado? <button class="banner-link" onclick="App.openSettings()">Activá la sincronización compartida</button></div>';
    return '<header class="top">' +
      '<div class="eyebrow">Itinerario</div>' +
      '<div class="trip-row">' +
        '<div><h1 class="trip-name">'+esc(state.tripName||'Mi viaje')+'</h1>' +
          (meta ? '<div class="trip-meta">'+esc(meta)+'</div>' : '') +
        '</div>' +
        '<button class="gear-btn" onclick="App.openSettings()" aria-label="Editar viaje">&#9881;</button>' +
      '</div>' +
      banner +
    '</header>';
  }

  function renderTabs(){
    return '<div class="tabs">' +
      '<button class="tab-btn'+(ui.activeTab==='agenda'?' active':'')+'" onclick="App.setTab(\'agenda\')">Agenda</button>' +
      '<button class="tab-btn'+(ui.activeTab==='traslados'?' active':'')+'" onclick="App.setTab(\'traslados\')">Traslados</button>' +
      '<button class="tab-btn'+(ui.activeTab==='noches'?' active':'')+'" onclick="App.setTab(\'noches\')">Noches</button>' +
      '<button class="tab-btn'+(ui.activeTab==='ideas'?' active':'')+'" onclick="App.setTab(\'ideas\')">Ideas</button>' +
    '</div>';
  }

  function renderAgenda(){
    var days = allDays();
    if(days.length === 0){
      return '<div class="empty-hint">Todavía no agregaste ciudades con fechas.<br><br>' +
        '<button class="btn primary" onclick="App.openSettings()">Agregar ciudades</button></div>';
    }
    var selDate = ui.selectedDate;
    var t = todayISO();
    var html = '<div class="day-strip">';
    days.forEach(function(d){
      var isSel = selDate===d.date;
      var isToday = d.date === t;
      html += '<div class="day-stub'+(isSel?' selected':'')+'" onclick="App.selectDay(\''+d.date+'\')">' +
        (isToday ? '<div class="today-stamp">HOY</div>' : '') +
        '<div class="dow">'+dowLabel(d.date)+'</div>' +
        '<div class="dnum">'+String(dayNum(d.date)).padStart(2,'0')+'</div>' +
        '<div class="mon">'+monLabel(d.date)+'</div>' +
        '<div class="city-tag">'+(d.cityName ? esc(d.cityName) : 'En tránsito')+'</div>' +
      '</div>';
    });
    html += '</div>';

    if(!selDate) return html;
    var selInfo = days.find(function(d){ return d.date===selDate; });
    var idx = days.indexOf(selInfo);
    html += '<div class="day-heading"><h2>'+fullLabel(selDate)+(selInfo.cityName ? ' · '+esc(selInfo.cityName) : ' · En tránsito')+'</h2>' +
      '<div class="progress">Día '+(idx+1)+' de '+days.length+'</div></div>';

    var transfers = transfersForDate(selDate);
    if(transfers.length){
      html += '<div class="section-label">Traslados<div class="line"></div></div>';
      transfers.forEach(function(tr){ html += renderTransferRow(tr); });
    }
    html += '<div class="btn-row"><button class="btn violet" onclick="App.openTransferForm(null, \''+selDate+'\')">+ Agregar traslado</button></div>';

    var stays = staysForDate(selDate);
    html += '<div class="section-label">Alojamiento<div class="line"></div></div>';
    if(stays.length === 0){
      html += '<div class="empty-hint">Sin alojamiento cargado para esta noche.</div>';
    } else {
      stays.forEach(function(s){ html += renderStayRow(s); });
    }
    html += '<div class="btn-row"><button class="btn sleep" onclick="App.openStayForm(null, '+(selInfo.cityId?('\''+selInfo.cityId+'\''):'null')+', \''+selDate+'\')">+ Agregar alojamiento</button></div>';

    if(!selInfo.cityId){
      html += '<div class="empty-hint" style="margin-top:16px;">Día de tránsito, sin ciudad asignada todavía. Los eventos con hora y las ideas se cargan dentro de una ciudad — elegí un día dentro del rango de alguna.</div>';
      return html;
    }

    var fixed = fixedForDay(selInfo.cityId, selDate);
    html += '<div class="section-label">Agenda del día<div class="line"></div></div>';
    if(fixed.length === 0){
      html += '<div class="empty-hint">Sin eventos con hora todavía.</div>';
    } else {
      fixed.forEach(function(e){ html += renderFixedRow(e); });
    }
    html += '<div class="btn-row">' +
      '<button class="btn primary" onclick="App.openFixedForm(null, \''+selInfo.cityId+'\', \''+selDate+'\')">+ Evento con hora</button>' +
      '<button class="btn teal" onclick="App.openIdeaForm(null, \''+selInfo.cityId+'\', \''+selDate+'\')">+ Idea para hoy</button>' +
    '</div>';

    var assigned = ideasAssignedForDay(selInfo.cityId, selDate);
    html += '<div class="section-label">Ideas para hoy<div class="line"></div></div>';
    if(assigned.length === 0){
      html += '<div class="empty-hint">No asignaste ideas flexibles a este día.</div>';
    } else {
      html += '<div class="empty-hint" style="margin-bottom:8px; padding:8px;">Usá ↑↓ para ordenarlas — ese orden es el que se usa en el mapa de abajo.</div>';
      assigned.forEach(function(i, idx){ html += renderIdeaRow(i, true, null, idx, assigned.length); });
    }

    var pool = ideasPoolForCity(selInfo.cityId);
    html += '<button class="collapsible-toggle" onclick="App.toggleNearby()">' +
      (ui.expandedNearby ? '▾' : '▸') + ' Ideas sin asignar en '+esc(selInfo.cityName)+' ('+pool.length+')' +
    '</button>';
    if(ui.expandedNearby){
      if(pool.length === 0){
        html += '<div class="empty-hint">No hay ideas pendientes en esta ciudad.</div>';
      } else {
        var groups = groupByZone(pool);
        Object.keys(groups).sort().forEach(function(z){
          html += '<div class="zone-title">'+esc(z)+'</div>';
          groups[z].forEach(function(i){ html += renderIdeaRow(i, false, selDate); });
        });
      }
    }

    html += '<div class="section-label">Mapa del día<div class="line"></div></div>' +
      '<div id="daymap-container"><div class="empty-hint">Cargando mapa…</div></div>';

    return html;
  }

  function renderTransferRow(t){
    var confirmMode = ui.pendingDelete === t.id;
    var icon = MODE_ICON[t.mode] || '➡️';
    return '<div class="transfer-row">' +
      '<div class="transfer-icon">'+icon+'</div>' +
      '<div class="transfer-body">' +
        '<div class="transfer-route">'+esc(t.from)+'<span class="arrow">→</span>'+esc(t.to)+'</div>' +
        '<div class="transfer-times">'+fullLabel(t.date)+(t.departTime?' · sale '+t.departTime:'')+(t.arriveTime?' · llega '+t.arriveTime:'')+'</div>' +
        (t.carrier ? '<div class="event-sub">🏷 '+esc(t.carrier)+'</div>' : '') +
        (t.confirmationCode ? '<div class="event-sub">🎫 Reserva: '+esc(t.confirmationCode)+'</div>' : '') +
        (t.notes ? '<div class="transfer-notes">'+esc(t.notes)+'</div>' : '') +
        (t.mode ? '<div class="transfer-mode">'+esc(t.mode)+'</div>' : '') +
      '</div>' +
      '<div class="row-actions">' +
        (confirmMode ?
          ('<button class="icon-btn confirm" onclick="App.deleteTransfer(\''+t.id+'\')">Sí, borrar</button>' +
           '<button class="icon-btn" onclick="App.cancelDelete()">Cancelar</button>')
          :
          ('<button class="icon-btn" onclick="App.openTransferForm(\''+t.id+'\')">Editar</button>' +
           '<button class="icon-btn danger" onclick="App.askDelete(\''+t.id+'\')">Borrar</button>')
        ) +
      '</div>' +
    '</div>';
  }

  function renderTransfersTab(){
    var list = allTransfersSorted();
    var html = '<div class="btn-row"><button class="btn violet full" onclick="App.openTransferForm(null)">+ Agregar traslado</button></div>';
    html += '<div class="section-label">Todos los traslados<div class="line"></div></div>';
    if(list.length === 0){
      html += '<div class="empty-hint">Todavía no cargaste vuelos, trenes u otros traslados entre ciudades.</div>';
    } else {
      list.forEach(function(t){ html += renderTransferRow(t); });
    }
    return html;
  }

        '<div class="stay-dates">'+fullLabel(s.checkIn)+' → '+fullLabel(s.checkOut)+'</div>' +
        (s.address ? '<div class="event-sub">📍 '+esc(s.address)+'</div>' : '') +
        (s.confirmationCode ? '<div class="event-sub">🎫 Reserva: '+esc(s.confirmationCode)+'</div>' : '') +
        (s.notes ? '<div class="stay-notes">'+esc(s.notes)+'</div>' : '') +
        (s.type ? '<div class="stay-mode">'+esc(s.type)+'</div>' : '') +
      '</div>' +
      '<div class="row-actions">' +
        (confirmMode ?
          ('<button class="icon-btn confirm" onclick="App.deleteStay(\''+s.id+'\')">Sí, borrar</button>' +
           '<button class="icon-btn" onclick="App.cancelDelete()">Cancelar</button>')
          :
          ('<button class="icon-btn" onclick="App.openStayForm(\''+s.id+'\')">Editar</button>' +
           '<button class="icon-btn danger" onclick="App.askDelete(\''+s.id+'\')">Borrar</button>')
        ) +
      '</div>' +
    '</div>';
  }

  function renderStaysTab(){
    var list = allStaysSorted();
    var html = '<div class="btn-row"><button class="btn sleep full" onclick="App.openStayForm(null)">+ Agregar alojamiento</button></div>';
    html += '<div class="section-label">Todo el alojamiento<div class="line"></div></div>';
    if(list.length === 0){
      html += '<div class="empty-hint">Todavía no cargaste hoteles, trenes nocturnos u otro alojamiento.</div>';
    } else {
      list.forEach(function(s){ html += renderStayRow(s); });
    }
    return html;
  }

  function renderFixedRow(e){
    var confirmMode = ui.pendingDelete === e.id;
    return '<div class="event-row">' +
      '<div class="event-time'+(e.time?'':' notime')+'">'+(e.time || 'S/H')+'</div>' +
      '<div class="event-body">' +
        '<div class="event-title">'+esc(e.title)+'</div>' +
        (e.location ? '<div class="event-sub">📍 '+esc(e.location)+'</div>' : '') +
        (e.notes ? '<div class="event-notes">'+esc(e.notes)+'</div>' : '') +
        (e.category ? '<div class="event-cat">'+esc(e.category)+'</div>' : '') +
      '</div>' +
      '<div class="row-actions">' +
        (confirmMode ?
          ('<button class="icon-btn confirm" onclick="App.deleteFixed(\''+e.id+'\')">Sí, borrar</button>' +
           '<button class="icon-btn" onclick="App.cancelDelete()">Cancelar</button>')
          :
          ('<button class="icon-btn" onclick="App.openFixedForm(\''+e.id+'\')">Editar</button>' +
           '<button class="icon-btn danger" onclick="App.askDelete(\''+e.id+'\')">Borrar</button>')
        ) +
      '</div>' +
    '</div>';
  }

  function renderIdeaRow(i, assignedContext, currentDate, idx, total){
    var confirmMode = ui.pendingDelete === i.id;
    var city = cityById(i.cityId);
    var dateOptions = '';
    if(city && city.startDate && city.endDate){
      dateOptions += '<option value="">Sin asignar</option>';
      rangeDates(city.startDate, city.endDate).forEach(function(d){
        dateOptions += '<option value="'+d+'"'+(i.assignedDate===d?' selected':'')+'>'+fullLabel(d)+'</option>';
      });
    }
    return '<div class="idea-row">' +
      '<div class="idea-body">' +
        '<div class="idea-zone">'+esc(i.zone||'Sin zona')+'</div>' +
        '<div class="idea-title">'+esc(i.title)+'</div>' +
        (i.duration ? '<div class="event-sub">⏱ '+esc(i.duration)+'</div>' : '') +
        (i.notes ? '<div class="idea-notes">'+esc(i.notes)+'</div>' : '') +
        (i.category ? '<div class="idea-cat">'+esc(i.category)+'</div>' : '') +
      '</div>' +
      '<div class="row-actions">' +
        (confirmMode ?
          ('<button class="icon-btn confirm" onclick="App.deleteIdea(\''+i.id+'\')">Sí, borrar</button>' +
           '<button class="icon-btn" onclick="App.cancelDelete()">Cancelar</button>')
          :
          ((assignedContext ?
             ((idx>0 ? '<button class="icon-btn" onclick="App.moveIdea(\''+i.id+'\',-1)">↑</button>' : '') +
              (idx<total-1 ? '<button class="icon-btn" onclick="App.moveIdea(\''+i.id+'\',1)">↓</button>' : ''))
             : '') +
           '<select class="assign-select" onchange="App.assignIdea(\''+i.id+'\', this.value)">'+dateOptions+'</select>' +
           '<button class="icon-btn" onclick="App.openIdeaForm(\''+i.id+'\')">Editar</button>' +
           '<button class="icon-btn danger" onclick="App.askDelete(\''+i.id+'\')">Borrar</button>')
        ) +
      '</div>' +
    '</div>';

  function renderIdeasBank(){
    if((state.cities||[]).length === 0){
      return '<div class="empty-hint">Agregá al menos una ciudad para empezar a sumar ideas.<br><br>' +
        '<button class="btn primary" onclick="App.openSettings()">Agregar ciudades</button></div>';
    }
    var html = '';
    state.cities.forEach(function(c){
      var ideas = (state.ideas||[]).filter(function(i){ return i.cityId===c.id; });
      var pool = ideas.filter(function(i){ return !i.assignedDate; });
      var assigned = ideas.filter(function(i){ return i.assignedDate; });
      html += '<div class="section-label">'+esc(c.name)+' · '+pool.length+' sin asignar<div class="line"></div></div>';
      if(pool.length === 0){
        html += '<div class="empty-hint">Sin ideas pendientes.</div>';
      } else {
        var groups = groupByZone(pool);
        Object.keys(groups).sort().forEach(function(z){
          html += '<div class="zone-title">'+esc(z)+'</div>';
          groups[z].forEach(function(i){ html += renderIdeaRow(i, false); });
        });
      }
      if(assigned.length){
        html += '<div class="zone-title">Ya asignadas ('+assigned.length+')</div>';
        assigned.sort(function(a,b){ return a.assignedDate.localeCompare(b.assignedDate); })
          .forEach(function(i){ html += renderIdeaRow(i, false); });
      }
      html += '<button class="btn teal full" onclick="App.openIdeaForm(null, \''+c.id+'\')">+ Agregar idea en '+esc(c.name)+'</button>';
    });
    return html;
  }

  /* ==================== onboarding ==================== */
  var onboardCities = null; // transient list while building
  function renderOnboarding(){
    if(!onboardCities) onboardCities = [{id: uid(), name:'', startDate:'', endDate:''}];
    var html = '<div class="onboard">' +
      '<div class="eyebrow">Itinerario</div>' +
      '<h1>Armemos tu viaje</h1>' +
      '<p class="lead">Ponele nombre al viaje y agregá cada ciudad con sus fechas. Después vas a poder cargar los eventos con hora fija y tus ideas sueltas por zona.</p>' +
      (!LOCAL_OK ? '<div class="storage-banner" style="margin-top:0; margin-bottom:20px;">⚠ Este navegador no permite guardar nada — abrí el archivo descargado directamente (no desde el chat). <button class="banner-link" onclick="App.openHowTo()">Ver cómo</button></div>' : '') +
      '<div class="field"><label>Nombre del viaje</label><input id="ob-name" type="text" placeholder="Ej: Europa 2026" value="'+esc(onboardTripName||'')+'"></div>';

    onboardCities.forEach(function(c, idx){
      html += '<div class="city-leg">' +
        (onboardCities.length>1 ? '<button class="icon-btn danger leg-remove" onclick="App.obRemoveCity(\''+c.id+'\')">✕</button>' : '') +
        '<div class="field"><label>Ciudad #'+(idx+1)+'</label><input type="text" placeholder="Ej: Roma" value="'+esc(c.name)+'" oninput="App.obUpdateCity(\''+c.id+'\',\'name\',this.value)"></div>' +
        '<div class="field-row">' +
          '<div class="field"><label>Llegada</label><input type="date" value="'+c.startDate+'" oninput="App.obUpdateCity(\''+c.id+'\',\'startDate\',this.value)"></div>' +
          '<div class="field"><label>Salida</label><input type="date" value="'+c.endDate+'" oninput="App.obUpdateCity(\''+c.id+'\',\'endDate\',this.value)"></div>' +
        '</div>' +
      '</div>';
    });

  /* ==================== map ==================== */
  var geocodeMemCache = {};
  var currentLeafletMap = null;

  function geoCacheKey(q){ return 'itin_geo_v1_' + q.toLowerCase().trim(); }
  function getCachedGeocode(q){
    if(geocodeMemCache.hasOwnProperty(q)) return geocodeMemCache[q];
    if(LOCAL_OK){
      try{
        var raw = window.localStorage.getItem(geoCacheKey(q));
        if(raw !== null){ var v = JSON.parse(raw); geocodeMemCache[q] = v; return v; }
      }catch(e){}
    }
    return undefined;
  }
  function setCachedGeocode(q, val){
    geocodeMemCache[q] = val;
    if(LOCAL_OK){ try{ window.localStorage.setItem(geoCacheKey(q), JSON.stringify(val)); }catch(e){} }
  }
  function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
  async function geocode(query){
    var cached = getCachedGeocode(query);
    if(cached !== undefined) return cached;
    try{
      var url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(query);
      var res = await fetch(url, {headers:{'Accept':'application/json'}});
      var data = await res.json();
      var val = (data && data[0]) ? {lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon)} : null;
      setCachedGeocode(query, val);
      return val;
    }catch(e){ return null; }
  }
  function buildGmapsUrl(stops){
    return 'https://www.google.com/maps/dir/' + stops.map(function(s){ return encodeURIComponent(s.query); }).join('/');
  }
  async function mountDayMap(date){
    var container = document.getElementById('daymap-container');
    if(!container) return;
    if(typeof L === 'undefined'){
      container.innerHTML = '<div class="empty-hint">Sin conexión — el mapa necesita internet para cargar.</div>';
      return;
    }
    var selInfo = allDays().find(function(d){ return d.date===date; });
    if(!selInfo || !selInfo.cityId){
      container.innerHTML = '<div class="empty-hint">Sin ciudad asignada este día.</div>';
      return;
    }
    var city = cityById(selInfo.cityId);
    var stops = [];
    fixedForDay(selInfo.cityId, date).forEach(function(e){
      if(e.location && e.location.trim()){
        stops.push({label: e.title, query: e.location.trim() + ', ' + (city?city.name:'')});
      }
    });
    ideasAssignedForDay(selInfo.cityId, date).forEach(function(i){
      stops.push({label: i.title, query: i.title + (i.zone?(', '+i.zone):'') + ', ' + (city?city.name:'')});
    });
    if(stops.length === 0){
      container.innerHTML = '<div class="empty-hint">Agregá una ubicación a tus eventos, o ideas para hoy, para ver el mapa de la ruta.</div>';
      return;
    }
    container.innerHTML = '<div class="empty-hint">Cargando mapa del día…</div>';
    var points = [];
    for(var i=0; i<stops.length; i++){
      if(ui.activeTab !== 'agenda' || ui.selectedDate !== date) return; // el usuario cambió de pantalla mientras cargaba
      var g = await geocode(stops[i].query);
      if(g) points.push({lat:g.lat, lon:g.lon, label: stops[i].label, n: points.length+1});
      if(i < stops.length-1) await sleep(1100);
    }
    if(ui.activeTab !== 'agenda' || ui.selectedDate !== date) return;
    container = document.getElementById('daymap-container');
    if(!container) return;
    if(points.length === 0){
      container.innerHTML = '<div class="empty-hint">No pudimos ubicar esas direcciones en el mapa. Probá con nombres más específicos.</div>';
      return;
    }
    container.innerHTML = '<div id="leaflet-map" style="height:220px; border-radius:10px; overflow:hidden;"></div>' +
      '<div class="btn-row" style="margin-top:8px;"><a class="btn violet full" style="text-decoration:none; display:flex; align-items:center; justify-content:center;" target="_blank" rel="noopener" href="'+buildGmapsUrl(stops)+'">🧭 Abrir ruta en Google Maps</a></div>';
    if(currentLeafletMap){ try{ currentLeafletMap.remove(); }catch(e){} currentLeafletMap = null; }
    var map = L.map('leaflet-map', {zoomControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);
    var latlngs = [];
    points.forEach(function(p){
      var icon = L.divIcon({className:'', html:'<div class="map-pin">'+p.n+'</div>', iconSize:[26,26], iconAnchor:[13,13]});
      L.marker([p.lat,p.lon], {icon:icon}).addTo(map).bindPopup(esc(p.label));
      latlngs.push([p.lat,p.lon]);
    });
    if(latlngs.length > 1){
      L.polyline(latlngs, {color:'#b8a1f5', weight:3, dashArray:'6,6'}).addTo(map);
      map.fitBounds(latlngs, {padding:[24,24]});
    } else {
      map.setView(latlngs[0], 14);
    }
    currentLeafletMap = map;
  }

    createSync: async function(){
      showToast('Activando sincronización…');
      try{
        state._syncMeta = {updatedAt: Date.now()};
        var id = await remoteCreate(state);
        syncId = id; setSyncIdLocal(id);
        cacheLocally();
        syncStatus = 'ok'; lastSyncedAt = Date.now();
        startPolling();
        render();
        showToast('¡Listo! Compartí el código con tu pareja.');
      }catch(e){
        console.error('Error creando sincronización:', e);
        showToast('Error: ' + ((e && e.message) ? e.message : String(e)));
      }
    },
    joinSync: async function(){
      var code = document.getElementById('join-code').value.trim();
      if(!code){ showToast('Pegá primero el código'); return; }
      showToast('Buscando itinerario compartido…');
      try{
        var remote = await remoteGet(code);
        if(!remote || !Array.isArray(remote.cities)){ showToast('Ese código no tiene un itinerario válido'); return; }
        state = remote;
        syncId = code; setSyncIdLocal(code);
        cacheLocally();
        syncStatus = 'ok'; lastSyncedAt = Date.now();
        startPolling();
        ui.modal = null; ui.selectedDate = null;
        render();
        showToast('¡Sincronizado con tu pareja!');
      }catch(e){
        console.error('Error uniéndose a la sincronización:', e);
        showToast('No se encontró ese código (' + ((e && e.message) ? e.message : String(e)) + ')');
      }
    },
    stopSync: function(){
      syncId = null; setSyncIdLocal(null);
      stopPolling();
      syncStatus = 'nosync';
      render();
      showToast('Sincronización desactivada — sigue guardado en este dispositivo');
    },
    forceSync: function(){ showToast('Sincronizando…'); pollRemote().then(function(){ render(); }); },
    testConnection: async function(){
      showToast('Probando conexión…');
      try{
        var res = await fetch('https://api.github.com/zen');
        if(!res.ok) throw new Error('HTTP '+res.status);
        var text = await res.text();
        showToast('✅ Funciona: "' + text.slice(0,40) + '"');
      }catch(e){
        showToast('❌ Falló incluso con GitHub: ' + ((e && e.message) ? e.message : String(e)));
      }
    },
    testKvdb: async function(){
      showToast('Probando kvdb.io…');
      try{
        var res = await fetch('https://kvdb.io/xxxxxNoExiste123456/test');
        showToast('✅ kvdb.io responde: HTTP ' + res.status);
      }catch(e){
        showToast('❌ kvdb.io no responde: ' + ((e && e.message) ? e.message : String(e)));
      }
    },
    shareSyncCode: async function(){
      var msg = 'Para ver nuestro itinerario de viaje, abrí la app y pegá este código de sincronización: ' + syncId;
      if(navigator.share){
        try{ await navigator.share({title:'Código de itinerario compartido', text: msg}); return; }
        catch(e){ if(e && e.name === 'AbortError') return; }
      }
      if(navigator.clipboard && navigator.clipboard.writeText){
        try{ await navigator.clipboard.writeText(msg); showToast('Copiado al portapapeles'); return; }
        catch(e){}
      }
      showToast('Copiá el código manualmente del campo de arriba');
    },
    shareBackup: async function(){
      var text = JSON.stringify(state);
      if(navigator.share){
        try{
          await navigator.share({title: 'Respaldo de itinerario', text: text});
          showToast('Compartido');
          return;
        }catch(e){ if(e && e.name === 'AbortError') return; /* si falla, seguimos probando abajo */ }
      }
      if(navigator.clipboard && navigator.clipboard.writeText){
        try{
          await navigator.clipboard.writeText(text);
          showToast('Copiado al portapapeles');
          return;
        }catch(e){ /* seguimos al método manual */ }
      }
      var el = document.getElementById('backup-json');
      if(el){ el.select(); showToast('Seleccionado — copialo con Ctrl/Cmd+C'); }
      else { showToast('Abrí "Editar viaje" para copiar el respaldo manualmente'); }
    },
    openFixedForm: function(id, cityId, date){
      ui.modal = {type:'fixed', payload: {id: id||null, cityId: cityId || (state.cities[0] && state.cities[0].id), date: date || todayISO()}};
      render();
    },
    openIdeaForm: function(id, cityId, date){
      ui.modal = {type:'idea', payload: {id: id||null, cityId: cityId || (state.cities[0] && state.cities[0].id), date: date||null}};
      render();
    },
    openTransferForm: function(id, date){
      ui.modal = {type:'transfer', payload: {id: id||null, date: date || todayISO()}};
      render();
    },
    openStayForm: function(id, cityId, date){
      ui.modal = {type:'stay', payload: {id: id||null, cityId: cityId||null, date: date || todayISO()}};
      render();
    },
    closeModal: function(){ ui.modal = null; render(); },

    saveFixed: function(ev, id){
      ev.preventDefault();
      var rec = {
        id: id || uid(),
        cityId: document.getElementById('f-city').value,
        date: document.getElementById('f-date').value,
        time: document.getElementById('f-time').value,
        title: document.getElementById('f-title').value.trim(),
        location: document.getElementById('f-loc').value.trim(),
        category: document.getElementById('f-cat').value,
        notes: document.getElementById('f-notes').value.trim()
      };
      if(!rec.title || !rec.date){ return; }
      state.fixedEvents = state.fixedEvents || [];
      var idx = state.fixedEvents.findIndex(function(e){return e.id===rec.id;});
      if(idx>=0) state.fixedEvents[idx] = rec; else state.fixedEvents.push(rec);
      ui.modal = null;
      render(); persist('Evento guardado');
    },
    deleteFixed: function(id){
      state.fixedEvents = (state.fixedEvents||[]).filter(function(e){return e.id!==id;});
      ui.pendingDelete = null; render(); persist('Evento borrado');
    },

    saveIdea: function(ev, id){
      ev.preventDefault();
      var existing = id ? (state.ideas||[]).find(function(i){return i.id===id;}) : null;
      var rec = {
        id: id || uid(),
        cityId: document.getElementById('i-city').value,
        zone: document.getElementById('i-zone').value.trim(),
        title: document.getElementById('i-title').value.trim(),
        duration: document.getElementById('i-dur').value.trim(),
        category: document.getElementById('i-cat').value,
        notes: document.getElementById('i-notes').value.trim(),
        assignedDate: existing ? existing.assignedDate : (ui.modal.payload.date || null)
      };
      if(!rec.title) return;
      state.ideas = state.ideas || [];
      var idx = state.ideas.findIndex(function(i){return i.id===rec.id;});
      if(idx>=0) state.ideas[idx] = rec; else state.ideas.push(rec);
      ui.modal = null;
      render(); persist('Idea guardada');
    },
    deleteIdea: function(id){
      state.ideas = (state.ideas||[]).filter(function(i){return i.id!==id;});
      ui.pendingDelete = null; render(); persist('Idea borrada');
    },
    assignIdea: function(id, date){
      var i = (state.ideas||[]).find(function(x){return x.id===id;});
      if(!i) return;
      i.assignedDate = date || null;
      render(); persist(date ? 'Asignada' : 'Quitada del día');
    },
    moveIdea: function(id, dir){
      var idea = (state.ideas||[]).find(function(x){return x.id===id;});
      if(!idea || !idea.assignedDate) return;
      var group = ideasAssignedForDay(idea.cityId, idea.assignedDate);
      var idx = group.findIndex(function(x){return x.id===id;});
      var swapIdx = idx + dir;
      if(swapIdx < 0 || swapIdx >= group.length) return;
      var other = group[swapIdx];
      var ai = state.ideas.indexOf(idea), bi = state.ideas.indexOf(other);
      state.ideas[ai] = other; state.ideas[bi] = idea;
      render(); persist('Orden actualizado');
    },

    saveTransfer: function(ev, id){
      ev.preventDefault();
      var rec = {
        id: id || uid(),
        from: document.getElementById('t-from').value.trim(),
        to: document.getElementById('t-to').value.trim(),
        date: document.getElementById('t-date').value,
        departTime: document.getElementById('t-depart').value,
        arriveTime: document.getElementById('t-arrive').value,
        mode: document.getElementById('t-mode').value,
        carrier: document.getElementById('t-carrier').value.trim(),
        confirmationCode: document.getElementById('t-conf').value.trim(),
        notes: document.getElementById('t-notes').value.trim()
      };
      if(!rec.from || !rec.to || !rec.date) return;
      state.transfers = state.transfers || [];
      var idx = state.transfers.findIndex(function(t){return t.id===rec.id;});
      if(idx>=0) state.transfers[idx] = rec; else state.transfers.push(rec);
      ui.modal = null; ui.selectedDate = rec.date;
      render(); persist('Traslado guardado');
    },
    deleteTransfer: function(id){
      state.transfers = (state.transfers||[]).filter(function(t){return t.id!==id;});
      ui.pendingDelete = null; render(); persist('Traslado borrado');
    },

    saveStay: function(ev, id){
      ev.preventDefault();
      var rec = {
        id: id || uid(),
        type: document.getElementById('s-type').value,
        cityId: document.getElementById('s-city').value || null,
        name: document.getElementById('s-name-f').value.trim(),
        checkIn: document.getElementById('s-checkin').value,
        checkOut: document.getElementById('s-checkout').value,
        address: document.getElementById('s-address').value.trim(),
        confirmationCode: document.getElementById('s-conf').value.trim(),
        notes: document.getElementById('s-notes').value.trim()
      };
      if(!rec.name || !rec.checkIn || !rec.checkOut || rec.checkOut <= rec.checkIn) return;
      state.stays = state.stays || [];
      var idx = state.stays.findIndex(function(s){return s.id===rec.id;});
      if(idx>=0) state.stays[idx] = rec; else state.stays.push(rec);
      ui.modal = null;
      render(); persist('Alojamiento guardado');
    },
    deleteStay: function(id){
      state.stays = (state.stays||[]).filter(function(s){return s.id!==id;});
      ui.pendingDelete = null; render(); persist('Alojamiento borrado');
    },

    askDelete: function(id){ ui.pendingDelete = id; render(); },
    cancelDelete: function(){ ui.pendingDelete = null; render(); },

    updateTripName: function(v){ state.tripName = v.trim(); persist('Guardado'); },
    updateCity: function(id, field, value){
      var c = cityById(id); if(!c) return;
      c[field] = value; render(); persist('Guardado');
    },
    addCitySettings: function(){
      state.cities.push({id: uid(), name:'Nueva ciudad', startDate:'', endDate:''});
      render(); persist('Guardado');
    },
    deleteCity: function(id){
      state.cities = state.cities.filter(function(c){return c.id!==id;});
      state.fixedEvents = (state.fixedEvents||[]).filter(function(e){return e.cityId!==id;});
      state.ideas = (state.ideas||[]).filter(function(i){return i.cityId!==id;});
      ui.pendingDelete = null; ui.selectedDate = null;
      render(); persist('Ciudad borrada');
    },

    restoreBackup: function(){
      var raw = document.getElementById('restore-json').value.trim();
      if(!raw){ showToast('Pegá primero el texto del respaldo'); return; }
      var parsed;
      try{ parsed = JSON.parse(raw); }
      catch(e){ showToast('Ese texto no es un respaldo válido'); return; }
      if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.cities)){
        showToast('Ese texto no tiene el formato esperado'); return;
      }
      parsed.fixedEvents = parsed.fixedEvents || [];
      parsed.ideas = parsed.ideas || [];
      parsed.transfers = parsed.transfers || [];
      parsed.stays = parsed.stays || [];
      state = parsed;
      ui.modal = null; ui.selectedDate = null; ui.pendingDelete = null;
      render(); persist('Itinerario restaurado');
    },

    /* onboarding */
    obAddCity: function(){ onboardCities.push({id: uid(), name:'', startDate:'', endDate:''}); render(); },
    obRemoveCity: function(id){ onboardCities = onboardCities.filter(function(c){return c.id!==id;}); render(); },
    obUpdateCity: function(id, field, value){
      var c = onboardCities.find(function(x){return x.id===id;});
      if(c) c[field] = value;
      onboardTripName = document.getElementById('ob-name') ? document.getElementById('ob-name').value : onboardTripName;
    },
    finishOnboarding: function(){
      var name = document.getElementById('ob-name').value.trim();
      onboardTripName = name;
      var valid = onboardCities.filter(function(c){ return c.name.trim() && c.startDate && c.endDate && c.endDate>=c.startDate; });
      if(!name){ onboardError = 'Ponele un nombre al viaje.'; render(); return; }
      if(valid.length === 0){ onboardError = 'Agregá al menos una ciudad con nombre y fechas válidas.'; render(); return; }
      onboardError = '';
      state = {
        tripName: name,
        cities: valid.map(function(c){ return {id: c.id, name: c.name.trim(), startDate: c.startDate, endDate: c.endDate}; }),
        fixedEvents: [],
        ideas: [],
        transfers: [],
        stays: []
      };
      onboardCities = null; onboardTripName = '';
      render(); persist('¡Itinerario creado!');
    }
  };

  /* ==================== boot ==================== */
  loadState().then(function(){
    render();
    if(syncId) startPolling();
  });

  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

})();
</script>
</body>
</html>
